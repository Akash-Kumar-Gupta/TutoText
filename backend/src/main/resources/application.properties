spring.application.name=tutotext
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL_MODE:DISABLED}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

gemini.api-key=${GEMINI_API_KEY:}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
server.error.include-message=never
server.error.include-stacktrace=never
app.rate-limit.registration.ip-capacity=${RATE_LIMIT_REGISTRATION_IP_CAPACITY:5}
app.rate-limit.registration.email-capacity=${RATE_LIMIT_REGISTRATION_EMAIL_CAPACITY:3}
app.rate-limit.registration.window-seconds=${RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:3600}
app.rate-limit.login.ip-capacity=${RATE_LIMIT_LOGIN_IP_CAPACITY:20}
app.rate-limit.login.email-capacity=${RATE_LIMIT_LOGIN_EMAIL_CAPACITY:10}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
app.rate-limit.live-token.ip-capacity=${RATE_LIMIT_LIVE_TOKEN_IP_CAPACITY:10}
app.rate-limit.live-token.account-capacity=${RATE_LIMIT_LIVE_TOKEN_ACCOUNT_CAPACITY:5}
app.rate-limit.live-token.window-seconds=${RATE_LIMIT_LIVE_TOKEN_WINDOW_SECONDS:600}
app.rate-limit.bucket-retention-seconds=${RATE_LIMIT_BUCKET_RETENTION_SECONDS:7200}
app.request-size.auth-bytes=${AUTH_REQUEST_MAX_BYTES:16384}
app.request-size.transcription-bytes=${TRANSCRIPTION_REQUEST_MAX_BYTES:17825792}
app.request-size.other-api-bytes=${OTHER_API_REQUEST_MAX_BYTES:65536}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Production requires explicit database coordinates and SSL mode. There is deliberately
# no SSL-mode fallback in this profile so missing deployment configuration fails startup.
#---
spring.config.activate.on-profile=production
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL_MODE}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=${DB_TRUSTSTORE_TYPE:JKS}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}
logging.level.com.zaxxer.hikari.HikariConfig=INFO
